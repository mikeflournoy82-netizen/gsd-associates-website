    function renderPosts(category = 'all') {
        const grid = document.getElementById('post-grid');
        const filtered = category === 'all' ? posts : posts.filter(p => p.category.includes(category));
        
        grid.innerHTML = filtered.map(post => `
            <a href="${post.url}" class="post-card bg-white rounded-2xl shadow-md overflow-hidden block border border-gray-100 hover:border-blue-300">
                <div class="h-32 bg-gradient-to-br from-blue-600 to-blue-800 flex items-center justify-center">
                    <span class="text-5xl">${post.emoji}</span>
                </div>
                <div class="p-6">
                    <h3 class="text-lg font-bold text-gray-900 mb-2">${post.title}</h3>
                    <div class="flex items-center gap-3 text-xs text-gray-500 mt-4">
                        <span>Michael Flournoy</span>
                        <span>·</span>
                        <span>${post.date}</span>
                        <span>·</span>
                        <span>${post.read} read</span>
                    </div>
                </div>
            </a>
        `).join('');
        
        document.getElementById('no-results').classList.toggle('hidden', filtered.length > 0);
    }

    function filterPosts(category) {
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.filter === category);
        });
