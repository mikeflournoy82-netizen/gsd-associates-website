    function renderPosts(category = 'all') {
        const grid = document.getElementById('post-grid');

        grid.innerHTML = filtered.map(post => `
            <a href="${post.url}" class="post-card bg-white rounded-2xl shadow-md overflow-hidden block border border-gray-100 hover:border-blue-300">
                <div class="h-32 bg-gradient-to-br from-blue-600 to-blue-800 flex items-center justify-center">

                        <span>·</span>
                        <span>${post.read} read</span>

            </a>
        `).join('');
        
        document.getElementById('no-results').classList.toggle('hidden', filtered.length > 0);
    }
